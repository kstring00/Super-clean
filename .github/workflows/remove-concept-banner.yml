name: Remove concept redesign banner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove concept redesign banner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="demo">Concept redesign — not affiliated with Super Clean Washateria</div>\n\n'
          if old not in s:
              raise SystemExit('Concept redesign banner not found; no changes made.')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')
          PY
          rm -f .github/workflows/remove-concept-banner.yml
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-concept-banner.yml
          git commit -m "Remove concept redesign banner"
          git push origin HEAD:main
